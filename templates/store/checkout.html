<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .checkout {
            width: 80%;
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .order-btn {
            width: 100%;
            padding: 14px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .order-btn:hover {
            background-color: #444;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: #555;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Checkout</h1>
</header>

<div class="checkout">

    <h2>Delivery Details</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>

        <label>Delivery Address</label>
        <textarea name="address" placeholder="Enter your complete address" required></textarea>

        <div class="total">
            Total Amount: ₹{{ total }}
        </div>

        <button type="submit" class="order-btn">
            Place Order
        </button>

    </form>

    <a href="{% url 'cart' %}" class="back-btn">
        Back to Cart
    </a>

</div>

</body>
</html>
