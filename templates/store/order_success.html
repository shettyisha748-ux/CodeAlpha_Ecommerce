<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .success {
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
        }

        h2 {
            color: #222;
        }

        .details {
            text-align: left;
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }

        .details p {
            margin: 10px 0;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: white;
            background-color: #222;
            padding: 12px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Order Confirmation</h1>
</header>

<div class="success">

    <div class="success-icon">
        ✅
    </div>

    <h2>Order Placed Successfully!</h2>

    <p>Thank you for your order.</p>

    {% if order %}

    <div class="details">

        <p>
            <strong>Name:</strong>
            {{ order.name }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ order.email }}
        </p>

        <p>
            <strong>Phone:</strong>
            {{ order.phone }}
        </p>

        <p>
            <strong>Address:</strong>
            {{ order.address }}
        </p>

        <p>
            <strong>Total Amount:</strong>
            ₹{{ order.total }}
        </p>

    </div>

    {% endif %}

    <a href="/" class="home-btn">
        Continue Shopping
    </a>

</div>

</body>
</html>
